[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopexai"
version = "1.0.0"
description = "A secure, multi-provider OpenAI-compatible AI gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "httpx>=0.28.1,<0.29",
  "httpcore>=1.0.9,<2.0",
  "SQLAlchemy[asyncio]>=2.0.38,<3.0",
  "asyncpg>=0.30,<1.0",
  "aiosqlite>=0.21,<1.0",
  "PyYAML>=6.0,<7.0",
  "pydantic>=2.10,<3.0",
  "cryptography>=44.0,<46.0",
  "alembic>=1.15,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10.0", "pytest-asyncio>=1.0,<2.0"]

[project.scripts]
hopexai = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
